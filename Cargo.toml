[workspace]
resolver = "2"
members = ["crates/proto", "crates/server", "crates/client-core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
transfer-proto = { path = "crates/proto" }
transfer-server = { path = "crates/server" }
transfer-client-core = { path = "crates/client-core" }

anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
rand = "0.8"
rcgen = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
webpki-roots = "1"

[profile.release]
lto = "thin"
strip = true
