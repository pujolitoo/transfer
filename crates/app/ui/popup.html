<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>File request</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="popup">
    <div class="popup-head">
      <strong id="title">Incoming file</strong>
      <button id="later" class="icon" title="Decide later" aria-label="Decide later">✕</button>
    </div>
    <div id="name" class="popup-name"></div>
    <div id="meta" class="muted small"></div>
    <div class="row">
      <button id="accept" class="primary">Accept</button>
      <button id="decline">Decline</button>
      <button id="open" class="link" hidden></button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
